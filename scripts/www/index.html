<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#10B981">
    <meta name="description" content="FitTrack Pro - 专业健身追踪应用，记录训练数据，追踪健身进度，获取个性化建议">
    <!-- PWA相关配置 -->
    <link rel="manifest" href="#" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="#" sizes="180x180">
    <link rel="icon" href="#" type="image/png" sizes="32x32">
    <title>FitTrack Pro - 专业健身追踪</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10B981', // 薄荷绿
                        secondary: '#F97316', // 能量橙
                        tertiary: '#3B82F6', // 活力蓝
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    screens: {
                        'xxs': '320px',
                        'xs': '375px',
                        'sm': '425px',
                        'md': '768px',
                        'lg': '1024px',
                        'xl': '1280px',
                        '2xl': '1536px',
                        '3xl': '1920px',
                    },
                    spacing: {
                        'safe-top': 'env(safe-area-inset-top)',
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass {
                @apply bg-white/70 dark:bg-dark/70 backdrop-blur-md;
            }
            .card {
                @apply rounded-xl shadow-lg p-4 transition-all duration-300 hover:shadow-xl;
            }
            .btn {
                @apply px-[clamp(0.75rem,4vw,1rem)] py-[clamp(0.5rem,2vw,0.5rem)] rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 text-[clamp(0.875rem,4vw,1rem)];
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-primary/90 active:scale-95;
            }
            .btn-secondary {
                @apply bg-secondary text-white hover:bg-secondary/90 active:scale-95;
            }
            .btn-tertiary {
                @apply bg-tertiary text-white hover:bg-tertiary/90 active:scale-95;
            }
            .btn-outline {
                @apply border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800;
            }
            .input-field {
                @apply w-full px-[clamp(0.75rem,4vw,1rem)] py-[clamp(0.5rem,2vw,0.5rem)] rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary/50 text-[clamp(0.875rem,4vw,1rem)];
            }
            .badge {
                @apply px-2 py-1 text-xs rounded-full font-medium;
            }
            .badge-chest { @apply text-blue-600 dark:text-blue-400 bg-transparent dark:bg-transparent; }
            .badge-back { @apply text-green-600 dark:text-green-400 bg-transparent dark:bg-transparent; }
            .badge-legs { @apply text-yellow-600 dark:text-yellow-400 bg-transparent dark:bg-transparent; }
            .badge-shoulders { @apply text-purple-600 dark:text-purple-400 bg-transparent dark:bg-transparent; }
            .badge-arms { @apply text-red-600 dark:text-red-400 bg-transparent dark:bg-transparent; }
            .badge-core { @apply text-indigo-600 dark:text-indigo-400 bg-transparent dark:bg-transparent; }
            .badge-cardio { @apply text-pink-600 dark:text-pink-400 bg-transparent dark:bg-transparent; }
            .badge-other { @apply text-gray-600 dark:text-gray-400 bg-transparent dark:bg-transparent; }
            
            /* 日历样式 */
            .calendar-day {
                @apply h-[18vw] min-h-[80px] max-h-[120px] p-1 border border-gray-200 dark:border-gray-700 rounded-lg transition-all duration-200;
            }
            .calendar-day-current {
                @apply bg-primary/10 dark:bg-primary/20 border-gray-200 dark:border-gray-700;
            }
            .calendar-day-past {
                @apply hover:bg-gray-100 dark:hover:bg-gray-800 cursor-pointer;
            }
            .calendar-day-future {
                @apply bg-gray-50 dark:bg-gray-900 text-gray-400 dark:text-gray-600 cursor-not-allowed;
            }
            .calendar-day-has-workout {
                @apply ring-0;
            }
            
            /* 主题切换动画 */
            .theme-transition {
                @apply transition-colors duration-300 ease-in-out;
            }
            
            /* 自定义滚动条 */
            .custom-scrollbar::-webkit-scrollbar {
                @apply w-2;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                @apply bg-gray-100 dark:bg-gray-800;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                @apply bg-gray-300 dark:bg-gray-700 rounded-full;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover {
                @apply bg-gray-400 dark:bg-gray-600;
            }
        }
    </style>
</head>
<body class="theme-transition min-h-screen bg-light dark:bg-dark text-gray-800 dark:text-gray-200 custom-scrollbar">
    <!-- 应用容器 -->
    <div id="app" class="flex flex-col min-h-screen max-w-md mx-auto bg-white dark:bg-gray-900 shadow-xl relative z-0">
        <!-- 顶部导航栏 -->
        <header class="theme-transition sticky top-0 z-50 glass border-b border-gray-200 dark:border-gray-800 pt-safe-top">
            <div class="flex items-center justify-between p-4">
                <div class="flex items-center gap-2">
                    <h1 class="text-[clamp(1.25rem,5vw,1.5rem)] font-bold text-primary">FitTrack Pro</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button id="settings-btn" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                        <i class="fa fa-cog text-[clamp(1rem,4vw,1.25rem)]"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="flex-1 overflow-y-auto custom-scrollbar">
            <!-- 视图容器 -->
            <div id="view-container" class="p-4">
                <!-- 日历视图 -->
                <div id="calendar-view" class="animate-fade-in">
                    <!-- 日历导航 -->
                    <div class="flex items-center justify-between mb-4">
                        <button id="prev-month" class="btn btn-outline">
                            <i class="fa fa-chevron-left"></i>
                        </button>
                        <h2 id="current-month" class="text-xl font-bold"></h2>
                        <button id="next-month" class="btn btn-outline">
                            <i class="fa fa-chevron-right"></i>
                        </button>
                    </div>

                    <!-- 星期标题 -->
                    <div class="grid grid-cols-7 gap-1 mb-1">
                        <div class="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">日</div>
                        <div class="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">一</div>
                        <div class="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">二</div>
                        <div class="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">三</div>
                        <div class="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">四</div>
                        <div class="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">五</div>
                        <div class="text-center text-sm font-medium text-gray-500 dark:text-gray-400 py-2">六</div>
                    </div>

                    <!-- 日历网格 -->
                    <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                        <!-- 日历天数将通过JS动态生成 -->
                    </div>
                </div>

                <!-- 训练记录视图 -->
                <div id="workout-view" class="hidden animate-fade-in">
                    <div class="flex items-center justify-between mb-4">
                        <button id="back-to-calendar" class="btn btn-outline">
                            <i class="fa fa-arrow-left"></i>
                            <span>返回</span>
                        </button>
                        <h2 id="workout-date" class="text-xl font-bold"></h2>
                        <div class="w-20"></div> <!-- 占位，保持标题居中 -->
                    </div>

                    <div id="workout-form" class="card glass mb-4">
                        <h3 class="text-lg font-semibold mb-4">添加训练记录</h3>
                        
                        <!-- 训练部位选择 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-2">训练部位</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button class="btn btn-outline part-btn" data-part="chest">胸</button>
                                <button class="btn btn-outline part-btn" data-part="back">背</button>
                                <button class="btn btn-outline part-btn" data-part="legs">腿</button>
                                <button class="btn btn-outline part-btn" data-part="shoulders">肩</button>
                                <button class="btn btn-outline part-btn" data-part="arms">臂</button>
                                <button class="btn btn-outline part-btn" data-part="core">腹</button>
                                <button class="btn btn-outline part-btn" data-part="cardio">有氧</button>
                                <button class="btn btn-outline part-btn" data-part="other">其他</button>
                            </div>
                            <input type="hidden" id="selected-part" value="">
                        </div>
                        
                        <!-- 动作名称 -->
                        <div class="mb-4">
                            <label for="exercise-name" class="block text-sm font-medium mb-2">动作名称</label>
                            <div class="flex gap-2">
                                <input type="text" id="exercise-name" class="input-field flex-1" placeholder="例如：卧推">
                                <button id="save-exercise" class="btn btn-primary">
                                    <i class="fa fa-plus"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- 训练数据 -->
                        <div id="workout-data" class="mb-4">
                            <label class="block text-sm font-medium mb-2">训练数据</label>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label for="reps-input" class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">次数</label>
                                    <input type="number" id="reps-input" class="input-field" placeholder="例如：12">
                                </div>
                                <div>
                                    <label for="weight-input" class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">重量 (kg)</label>
                                    <input type="number" id="weight-input" class="input-field" placeholder="例如：60">
                                </div>
                                <div>
                                    <label for="sets-input" class="text-xs text-gray-500 dark:text-gray-400 mb-1 block">组数</label>
                                    <input type="number" id="sets-input" class="input-field" placeholder="例如：3" min="1" max="10">
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex justify-end mb-4">
                            <button id="clear-form" class="btn btn-outline">
                                <i class="fa fa-refresh"></i>
                                <span>清空</span>
                            </button>
                        </div>
                        
                        <!-- 备注 -->
                        <div class="mb-4">
                            <label for="workout-notes" class="block text-sm font-medium mb-2">备注</label>
                            <textarea id="workout-notes" class="input-field" rows="2" placeholder="添加备注..."></textarea>
                        </div>
                        
                        <button id="save-workout" class="btn btn-primary w-full">
                            <i class="fa fa-save"></i>
                            <span>保存训练记录</span>
                        </button>
                    </div>
                    
                    <!-- 已保存的训练记录 -->
                    <div id="saved-workouts" class="space-y-4">
                        <h3 class="text-lg font-semibold mb-2">已保存的训练</h3>
                        <div id="workouts-list" class="space-y-3">
                            <!-- 训练记录将通过JS动态生成 -->
                        </div>
                    </div>
                </div>

                <!-- 统计视图 -->
                <div id="stats-view" class="hidden animate-fade-in">
                    <h2 class="text-xl font-bold mb-4">训练统计</h2>
                    
                    <!-- 时间范围选择 -->
                    <div class="flex gap-2 mb-6 overflow-x-auto pb-2 custom-scrollbar">
                        <button class="btn btn-primary time-range-btn" data-range="week">本周</button>
                        <button class="btn btn-outline time-range-btn" data-range="month">本月</button>
                        <button class="btn btn-outline time-range-btn" data-range="year">本年</button>
                        <button class="btn btn-outline time-range-btn" data-range="all">全部</button>
                    </div>
                    
                    <!-- 统计卡片 -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="card glass">
                            <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400">训练天数</h3>
                            <p id="workout-days" class="text-2xl font-bold">0</p>
                        </div>
                        <div class="card glass">
                            <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400">训练次数</h3>
                            <p id="workout-count" class="text-2xl font-bold">0</p>
                        </div>
                        <div class="card glass">
                            <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400">总组数</h3>
                            <p id="total-sets" class="text-2xl font-bold">0</p>
                        </div>
                        <div class="card glass">
                            <h3 class="text-sm font-medium text-gray-500 dark:text-gray-400">平均每周</h3>
                            <p id="weekly-average" class="text-2xl font-bold">0 天</p>
                        </div>
                    </div>
                    
                    <!-- 部位分布图表 -->
                    <div class="card glass mb-6">
                        <h3 class="text-[clamp(1rem,5vw,1.25rem)] font-semibold mb-4">训练部位分布</h3>
                        <div class="h-[clamp(16rem,60vw,24rem)] max-h-[320px]">
                            <canvas id="parts-chart"></canvas>
                        </div>
                    </div>
                    
                    <!-- 训练趋势图表 -->
                    <div class="card glass mb-6">
                        <h3 class="text-[clamp(1rem,5vw,1.25rem)] font-semibold mb-4">训练趋势</h3>
                        <div class="h-[clamp(16rem,60vw,24rem)] max-h-[320px]">
                            <canvas id="trend-chart"></canvas>
                        </div>
                    </div>
                    
                    <!-- 智能建议 -->
                    <div class="card glass bg-primary/5 dark:bg-primary/10 border border-primary/20">
                        <div class="flex items-start gap-3">
                            <div class="p-2 bg-primary/20 rounded-full text-primary">
                                <i class="fa fa-lightbulb-o text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold mb-2">智能建议</h3>
                                <div id="ai-suggestions" class="space-y-2 text-sm">
                                    <p class="animate-pulse-slow">正在分析你的训练数据...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部导航栏 -->
        <footer class="theme-transition sticky bottom-0 z-50 glass border-t border-gray-200 dark:border-gray-800 pb-safe-bottom">
            <div class="flex justify-around p-2">
                <button id="nav-calendar" class="nav-btn flex flex-col items-center p-2 rounded-lg bg-primary/10 text-primary transition-all">
                    <i class="fa fa-calendar text-[clamp(1.25rem,5vw,1.5rem)]"></i>
                    <span class="text-[clamp(0.75rem,3vw,0.875rem)] mt-1">日历</span>
                </button>
                <button id="nav-stats" class="nav-btn flex flex-col items-center p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">
                    <i class="fa fa-bar-chart text-[clamp(1.25rem,5vw,1.5rem)]"></i>
                    <span class="text-[clamp(0.75rem,3vw,0.875rem)] mt-1">统计</span>
                </button>
                <button id="nav-profile" class="nav-btn flex flex-col items-center p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-all">
                    <i class="fa fa-user text-[clamp(1.25rem,5vw,1.5rem)]"></i>
                    <span class="text-[clamp(0.75rem,3vw,0.875rem)] mt-1">我的</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="modal-overlay"></div>
        <div class="absolute bottom-0 left-0 right-0 glass rounded-t-2xl p-6 animate-slide-up">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold">设置</h2>
                <button id="close-settings" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            

            


            
            <!-- 背景图片设置 -->
            <div class="mb-6">
                <h3 class="text-lg font-semibold mb-3">背景图片</h3>
                <div class="flex flex-col gap-3">
                    <button id="select-background" class="btn btn-primary flex-1">
                        <i class="fa fa-image mr-2"></i>
                        <span>选择图片</span>
                    </button>

                    <button id="clear-background" class="btn btn-outline flex-1">
                        <i class="fa fa-trash-o mr-2"></i>
                        <span>清除背景</span>
                    </button>
                    <div class="mt-2">
                        <label for="background-opacity" class="block text-sm font-medium mb-2">透明度</label>
                        <input type="range" id="background-opacity" min="50" max="100" value="90" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-xs text-gray-500 mt-1">
                            <span>半透明</span>
                            <span>不透明</span>
                        </div>
                    </div>
                    <input type="file" id="background-input" accept="image/*" class="hidden">
                </div>
            </div>
            
            <!-- 数据管理 -->
            <div>
                <h3 class="text-lg font-semibold mb-3">数据管理</h3>
                <div class="flex gap-3 mb-3">
                    <button id="import-data" class="btn btn-outline flex-1">
                        <i class="fa fa-upload"></i>
                        <span>导入数据</span>
                    </button>
                    <button id="export-data" class="btn btn-outline flex-1">
                        <i class="fa fa-download"></i>
                        <span>导出数据</span>
                    </button>
                </div>
                <div class="flex gap-3">
                    <button id="clear-data" class="btn btn-outline flex-1 text-red-500 border-red-300 dark:border-red-700 hover:bg-red-50 dark:hover:bg-red-900/20">
                        <i class="fa fa-trash-o"></i>
                        <span>清除数据</span>
                    </button>
                </div>
                <input type="file" id="import-input" accept=".json" class="hidden">
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div id="confirm-dialog" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="glass rounded-2xl p-6 w-full max-w-xs animate-slide-up">
                <h3 id="confirm-title" class="text-xl font-bold mb-3">确认操作</h3>
                <p id="confirm-message" class="text-gray-600 dark:text-gray-400 mb-6">确定要执行此操作吗？</p>
                <div class="flex gap-3">
                    <button id="confirm-cancel" class="btn btn-outline flex-1">取消</button>
                    <button id="confirm-ok" class="btn btn-primary flex-1">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片裁剪模态框 -->
    <div id="crop-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="crop-overlay"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 glass rounded-2xl p-4 w-full max-w-lg animate-scale-in">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold">设置背景图片</h3>
                <button id="close-crop" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            
            <!-- 图片裁剪区域 -->
            <div class="relative w-full h-[50vh] bg-gray-100 dark:bg-gray-800 rounded-lg overflow-hidden mb-4">
                <img id="crop-image" class="absolute top-0 left-0 w-full h-full object-contain" src="" alt="裁剪预览">
                <div id="crop-selection" class="absolute border-2 border-white bg-white/20 cursor-move"></div>
                <div class="absolute top-2 left-2 bg-black/70 text-white px-3 py-1 rounded-full text-sm">
                    拖动选择区域
                </div>
            </div>
            
            <!-- 透明度设置 -->
            <div class="mb-4">
                <label for="crop-opacity" class="block text-sm font-medium mb-2">透明度</label>
                <input type="range" id="crop-opacity" min="50" max="100" value="90" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-xs text-gray-500 mt-1">
                    <span>半透明</span>
                    <span>不透明</span>
                </div>
            </div>
            
            <!-- 操作按钮 -->
            <div class="flex gap-3">
                <button id="cancel-crop" class="btn btn-outline flex-1">取消</button>
                <button id="apply-crop" class="btn btn-primary flex-1">保存并应用</button>
            </div>
        </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 hidden">
        <div class="glass rounded-lg px-4 py-3 shadow-lg flex items-center gap-2 animate-fade-in">
            <i id="toast-icon" class="fa fa-check-circle text-green-500"></i>
            <span id="toast-message">操作成功</span>
        </div>
    </div>

    <script>
        // 全局变量
        const app = {
            currentDate: new Date(),
            selectedDate: null,
            currentView: 'calendar',

        // 渲染日历
        function renderCalendar() {
            const year = app.currentDate.getFullYear();
            const month = app.currentDate.getMonth();

            // 更新当前月份显示
            elements.currentMonth.textContent = `${year}年${month + 1}月`;

            // 获取当月第一天是星期几
            const firstDay = new Date(year, month, 1).getDay();

            // 获取当月的天数
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // 获取当前日期
            const today = new Date();
            const todayDate = today.getDate();
            const todayMonth = today.getMonth();
            const todayYear = today.getFullYear();

            // 清空日历网格
            elements.calendarGrid.innerHTML = '';

            // 添加空白格子（上个月的日期）
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day calendar-day-future';
                elements.calendarGrid.appendChild(emptyDay);
            }

            // 添加当月的日期
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';

                // 判断是否是今天
                const isToday = day === todayDate && month === todayMonth && year === todayYear;
                if (isToday) {
                    dayElement.classList.add('calendar-day-current');
                }

                // 判断是否是未来日期
                const isFuture = year > todayYear || 
                                (year === todayYear && month > todayMonth) || 
                                (year === todayYear && month === todayMonth && day > todayDate);
                
                if (isFuture) {
                    dayElement.classList.add('calendar-day-future');
                } else {
                    dayElement.classList.add('calendar-day-past');
                    dayElement.addEventListener('click', () => openWorkoutView(dateStr));
                }

                // 检查是否有训练记录
                const hasWorkout = app.workouts[dateStr] && app.workouts[dateStr].workouts.length > 0;
                if (hasWorkout) {
                    dayElement.classList.add('calendar-day-has-workout');
                }

                // 创建日期内容
                const dayContent = document.createElement('div');
                dayContent.className = 'flex flex-col h-full';
                
                // 日期数字
                const dayNumber = document.createElement('span');
                dayNumber.className = 'text-sm font-medium mb-1';
                dayNumber.textContent = day;
                dayContent.appendChild(dayNumber);

                // 如果有训练记录，显示训练部位
                if (hasWorkout) {
                    const workoutParts = getUniquePartsForDate(dateStr);
                    const partsContainer = document.createElement('div');
                    partsContainer.className = 'grid grid-cols-2 gap-0.5 mt-auto';
                    
                    workoutParts.forEach(part => {
                        const partBadge = document.createElement('span');
                        partBadge.className = `badge badge-${part} text-[9px] px-1 py-0.5 rounded text-center`;
                        partBadge.textContent = app.parts[part];
                        partsContainer.appendChild(partBadge);
                    });
                    
                    dayContent.appendChild(partsContainer);
                }

                dayElement.appendChild(dayContent);
                elements.calendarGrid.appendChild(dayElement);
            }
        }

        // 获取指定日期的唯一训练部位
        function getUniquePartsForDate(dateStr) {
            if (!app.workouts[dateStr] || !app.workouts[dateStr].workouts) {
                return [];
            }
            
            const parts = new Set();
            app.workouts[dateStr].workouts.forEach(workout => {
                parts.add(workout.part);
            });
            
            return Array.from(parts);
        }

        // 打开训练记录视图
        function openWorkoutView(dateStr) {
            app.selectedDate = dateStr;
            
            // 解析日期字符串
            const [year, month, day] = dateStr.split('-');
            elements.workoutDate.textContent = `${year}年${month}月${day}日`;
            
            // 清空表单
            clearWorkoutForm();
            
            // 加载已保存的训练记录
            loadWorkoutRecords(dateStr);
            
            // 显示训练记录视图
            showView('workout');
        }

        // 加载已保存的训练记录
        function loadWorkoutRecords(dateStr) {
            elements.workoutsList.innerHTML = '';
            
            if (!app.workouts[dateStr] || !app.workouts[dateStr].workouts || app.workouts[dateStr].workouts.length === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'text-center py-6 text-gray-500 dark:text-gray-400';
                emptyState.innerHTML = `
                    <i class="fa fa-futbol-o text-4xl mb-2"></i>
                    <p>暂无训练记录</p>
                    <p class="text-sm">添加你的第一条训练记录吧！</p>
                `;
                elements.workoutsList.appendChild(emptyState);
                return;
            }
            
            app.workouts[dateStr].workouts.forEach((workout, index) => {
                const workoutElement = document.createElement('div');
                workoutElement.className = 'card glass';
                
                // 训练部位和动作名称
                const header = document.createElement('div');
                header.className = 'flex items-center justify-between mb-3';
                header.innerHTML = `
                    <div>
                        <span class="badge badge-${workout.part}">${app.parts[workout.part]}</span>
                        <h4 class="font-medium mt-1">${workout.exercise}</h4>
                    </div>
                    <div class="flex gap-2">
                        <button class="btn btn-outline p-1 edit-workout" data-index="${index}">
                            <i class="fa fa-pencil"></i>
                        </button>
                        <button class="btn btn-outline p-1 text-red-500 delete-workout" data-index="${index}">
                            <i class="fa fa-trash-o"></i>
                        </button>
                    </div>
                `;
                
                // 训练组数
                const sets = document.createElement('div');
                sets.className = 'space-y-1 mb-2';
                
                workout.sets.forEach((set, setIndex) => {
                    const setElement = document.createElement('div');
                    setElement.className = 'flex items-center gap-2 text-sm';
                    setElement.innerHTML = `
                        <span class="w-6 text-center">${setIndex + 1}</span>
                        <span class="flex-1">${set.reps} 次</span>
                        <span>${set.weight} ${app.settings.units}</span>
                    `;
                    sets.appendChild(setElement);
                });
                
                // 备注
                const notes = document.createElement('div');
                if (workout.notes) {
                    notes.className = 'text-sm text-gray-600 dark:text-gray-400 mt-2';
                    notes.textContent = workout.notes;
                }
                
                workoutElement.appendChild(header);
                workoutElement.appendChild(sets);
                if (workout.notes) {
                    workoutElement.appendChild(notes);
                }
                
                elements.workoutsList.appendChild(workoutElement);
            });
            
            // 添加编辑和删除事件监听器
            document.querySelectorAll('.edit-workout').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = parseInt(btn.dataset.index);
                    editWorkout(index);
                });
            });
            
            document.querySelectorAll('.delete-workout').forEach(btn => {
                btn.addEventListener('click', () => {
                    const index = parseInt(btn.dataset.index);
                    deleteWorkout(index);
                });
            });
        }

        // 保存训练记录
        function saveWorkoutRecord() {
            const part = elements.selectedPart.value;
            const exercise = elements.exerciseName.value.trim();
            const notes = elements.workoutNotes.value.trim();
            const reps = parseInt(elements.repsInput.value);
            const weight = parseFloat(elements.weightInput.value);
            const setsCount = parseInt(elements.setsInput.value);
            
            // 验证表单
            if (!part) {
                showToast('请选择训练部位', 'error');
                return;
            }
            
            if (!exercise) {
                showToast('请输入动作名称', 'error');
                return;
            }
            
            if (!reps || !weight || !setsCount) {
                showToast('请填写完整的训练数据', 'error');
                return;
            }
            
            // 根据组数生成训练组数据
            const sets = [];
            for (let i = 0; i < setsCount; i++) {
                sets.push({ reps, weight });
            }
            
            // 创建训练记录
            const workout = {
                id: generateId(),
                part,
                exercise,
                sets,
                notes,
                timestamp: new Date().toISOString()
            };
            
            // 保存到数据中
            if (!app.workouts[app.selectedDate]) {
                app.workouts[app.selectedDate] = {
                    date: app.selectedDate,
                    workouts: []
                };
            }
            
            app.workouts[app.selectedDate].workouts.push(workout);
            
            // 保存数据
            saveData();
            
            // 显示成功提示
            showToast('训练记录已保存', 'success');
            
            // 重新加载训练记录
            loadWorkoutRecords(app.selectedDate);
            
            // 清空表单
            clearWorkoutForm();
            
            // 更新日历
            renderCalendar();
            
            // 检查是否需要生成智能建议
            checkAndGenerateSuggestions();
        }
        
        // 检查并生成智能建议
        function checkAndGenerateSuggestions() {
            // 计算训练记录总数
            let totalWorkouts = 0;
            for (const dateStr in app.workouts) {
                if (app.workouts[dateStr].workouts) {
                    totalWorkouts += app.workouts[dateStr].workouts.length;
                }
            }
            
            // 每保存3条记录或达到特定里程碑时显示建议
            const milestones = [1, 3, 5, 10, 15, 20, 30, 50];
            if (milestones.includes(totalWorkouts)) {
                // 生成建议并显示
                const stats = calculateStats(app.workouts);
                const suggestions = generateSmartSuggestions(stats, totalWorkouts);
                
                // 显示建议弹窗
                showSuggestionsModal(suggestions);
            }
        }
        
        // 生成智能建议
        function generateSmartSuggestions(stats, totalWorkouts) {
            const suggestions = [];
            
            // 欢迎建议（第一条记录）
            if (totalWorkouts === 1) {
                suggestions.push({
                    type: 'welcome',
                    title: '欢迎开始健身之旅！',
                    icon: 'fa-star',
                    text: '恭喜你完成了第一条训练记录！坚持记录是实现健身目标的重要一步。',
                    priority: 'high'
                });
                return suggestions;
            }
            
            // 训练频率建议
            if (stats.weeklyAverage < 2) {
                suggestions.push({
                    type: 'frequency',
                    title: '增加训练频率',
                    icon: 'fa-calendar-plus-o',
                    text: `你的平均每周训练天数为 ${stats.weeklyAverage.toFixed(1)} 天。为了获得更好的效果，建议每周至少训练3-4天。`,
                    priority: stats.weeklyAverage < 1 ? 'high' : 'medium'
                });
            } else if (stats.weeklyAverage >= 5) {
                suggestions.push({
                    type: 'recovery',
                    title: '注意恢复',
                    icon: 'fa-balance-scale',
                    text: `你的训练频率很好（每周 ${stats.weeklyAverage.toFixed(1)} 天）！记得合理安排休息日，避免过度训练导致疲劳和受伤。`,
                    priority: 'medium'
                });
            }
            
            // 训练部位平衡建议
            const parts = Object.keys(stats.partsDistribution);
            const trainedParts = parts.filter(part => stats.partsDistribution[part] > 0);
            
            if (trainedParts.length < 3 && totalWorkouts >= 3) {
                suggestions.push({
                    type: 'diversity',
                    title: '多样化训练部位',
                    icon: 'fa-dumbbell',
                    text: `你目前主要训练 ${trainedParts.length} 个部位。尝试多样化训练部位，全面发展肌肉群，避免肌肉不平衡。`,
                    priority: 'high'
                });
            }
            
            // 特定部位训练建议
            const partThresholds = {
                legs: 2,
                core: 2,
                cardio: 1
            };
            
            const partSuggestions = {
                legs: {
                    title: '增加腿部训练',
                    icon: 'fa-futbol-o',
                    text: '腿部训练对整体健康和代谢有重要影响，建议每周至少安排1-2次腿部训练。'
                },
                core: {
                    title: '加强核心训练',
                    icon: 'fa-child',
                    text: '核心训练有助于改善姿势和平衡能力，建议增加核心训练的频率。'
                },
                cardio: {
                    title: '添加有氧训练',
                    icon: 'fa-heartbeat',
                    text: '有氧训练对心血管健康至关重要，建议每周至少进行150分钟中等强度的有氧训练。'
                }
            };
            
            for (const part in partThresholds) {
                if (!trainedParts.includes(part) || stats.partsDistribution[part] < partThresholds[part]) {
                    suggestions.push({
                        type: `part-${part}`,
                        title: partSuggestions[part].title,
                        icon: partSuggestions[part].icon,
                        text: partSuggestions[part].text,
                        priority: !trainedParts.includes(part) ? 'high' : 'medium'
                    });
                }
            }
            
            // 训练进步建议
            if (totalWorkouts >= 5) {
                suggestions.push({
                    type: 'progress',
                    title: '关注训练进步',
                    icon: 'fa-line-chart',
                    text: '随着训练的进行，记得逐渐增加重量或次数来挑战自己，避免训练停滞不前。',
                    priority: 'medium'
                });
            }
            
            // 训练计划建议
            if (totalWorkouts >= 10) {
                suggestions.push({
                    type: 'planning',
                    title: '制定训练计划',
                    icon: 'fa-calendar-check-o',
                    text: '考虑制定一个结构化的训练计划，包括不同部位的训练日和明确的目标，这将帮助你更系统地进步。',
                    priority: 'low'
                });
            }
            
            // 排序建议（按优先级）
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            suggestions.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
            
            // 最多返回3条建议
            return suggestions.slice(0, 3);
        }

        // 更新统计数据
        function updateStats(range) {
            // 获取日期范围
            const { startDate, endDate } = getDateRange(range);
            
            // 过滤日期范围内的训练记录
            const filteredWorkouts = filterWorkoutsByDateRange(startDate, endDate);
            
            // 计算统计数据
            const stats = calculateStats(filteredWorkouts);
            
            // 更新统计卡片
            elements.workoutDays.textContent = stats.workoutDays;
            elements.workoutCount.textContent = stats.workoutCount;
            elements.totalSets.textContent = stats.totalSets;
            elements.weeklyAverage.textContent = `${stats.weeklyAverage.toFixed(1)} 天`;
            
            // 更新图表
            updatePartsChart(stats.partsDistribution);
            updateTrendChart(filteredWorkouts, range);
            
            // 更新智能建议
            updateAISuggestions(stats);
        }

        // 获取日期范围
        function getDateRange(range) {
            const today = new Date();
            let startDate, endDate;
            
            switch (range) {
                case 'week':
                    // 本周（从周一开始）
                    const dayOfWeek = today.getDay() || 7; // 将周日从0改为7
                    startDate = new Date(today);
                    startDate.setDate(today.getDate() - dayOfWeek + 1);
                    endDate = new Date(today);
                    break;
                case 'month':
                    // 本月
                    startDate = new Date(today.getFullYear(), today.getMonth(), 1);
                    endDate = new Date(today);
                    break;
                case 'year':
                    // 本年
                    startDate = new Date(today.getFullYear(), 0, 1);
                    endDate = new Date(today);
                    break;
                case 'all':
                    // 所有时间
                    startDate = new Date(0);
                    endDate = new Date(today);
                    break;
                default:
                    startDate = new Date(today);
                    endDate = new Date(today);
            }
            
            // 设置时间为当天的开始和结束
            startDate.setHours(0, 0, 0, 0);
            endDate.setHours(23, 59, 59, 999);
            
            return { startDate, endDate };
        }

        // 过滤日期范围内的训练记录
        function filterWorkoutsByDateRange(startDate, endDate) {
            const filtered = {};
            
            for (const dateStr in app.workouts) {
                const date = new Date(dateStr);
                
                if (date >= startDate && date <= endDate) {
                    filtered[dateStr] = app.workouts[dateStr];
                }
            }
            
            return filtered;
        }

        // 计算统计数据
        function calculateStats(workouts) {
            let workoutDays = 0;
            let workoutCount = 0;
            let totalSets = 0;
            const partsDistribution = {};
            
            // 初始化部位分布
            Object.keys(app.parts).forEach(part => {
                partsDistribution[part] = 0;
            });
            
            // 计算统计数据
            for (const dateStr in workouts) {
                if (workouts[dateStr].workouts && workouts[dateStr].workouts.length > 0) {
                    workoutDays++;
                    
                    workouts[dateStr].workouts.forEach(workout => {
                        workoutCount++;
                        totalSets += workout.sets.length;
                        partsDistribution[workout.part]++;
                    });
                }
            }
            
            // 计算每周平均训练天数
            const today = new Date();
            const startOfYear = new Date(today.getFullYear(), 0, 1);
            const daysInYear = Math.ceil((today - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
            const weeksInYear = daysInYear / 7;
            const weeklyAverage = weeksInYear > 0 ? workoutDays / weeksInYear : 0;
            
            return {
                workoutDays,
                workoutCount,
                totalSets,
                partsDistribution,
                weeklyAverage
            };
        }

        // 更新部位分布图表
        function updatePartsChart(partsDistribution) {

                    switch (part) {
                        case 'chest': backgroundColors.push('#3B82F6'); break; // 蓝色
                        case 'back': backgroundColors.push('#10B981'); break; // 绿色
                        case 'legs': backgroundColors.push('#F59E0B'); break; // 黄色
                        case 'shoulders': backgroundColors.push('#8B5CF6'); break; // 紫色
                        case 'arms': backgroundColors.push('#EF4444'); break; // 红色
                        case 'core': backgroundColors.push('#6366F1'); break; // 靛蓝色
                        case 'cardio': backgroundColors.push('#EC4899'); break; // 粉色
                        case 'other': backgroundColors.push('#6B7280'); break; // 灰色
                        default: backgroundColors.push('#9CA3AF');
                    }
                }
            }
            
            // 创建图表
            app.charts.parts = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: backgroundColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: document.documentElement.classList.contains('dark') ? '#E5E7EB' : '#4B5563',
                                padding: 15,

        // 更新训练趋势图表
        function updateTrendChart(workouts, range) {
            const ctx = document.getElementById('trend-chart').getContext('2d');
            
            // 如果图表已存在，销毁它
            if (app.charts.trend) {
                app.charts.trend.destroy();
            }
            
            // 准备数据
            const labels = [];
            const data = [];
            
            // 根据范围生成标签
            const today = new Date();
            let days = 0;
            let step = 1;
            
            switch (range) {
                case 'week':
                    days = 7;
                    break;
                case 'month':
                    days = 30;
                    step = 3;
                    break;
                case 'year':
                    days = 365;
                    step = 30;
                    break;
                case 'all':
                    // 计算从第一条记录到今天的天数
                    const firstDate = getFirstWorkoutDate();
                    if (firstDate) {
                        days = Math.ceil((today - firstDate) / (1000 * 60 * 60 * 24)) + 1;
                    } else {
                        days = 30;
                    }
                    step = days > 90 ? 30 : (days > 30 ? 7 : 1);
                    break;
            }
            
            // 生成日期标签和数据
            for (let i = days - 1; i >= 0; i -= step) {
                const date = new Date(today);
                date.setDate(today.getDate() - i);
                
                const dateStr = formatDate(date);
                labels.push(formatLabel(date, range));
                
                // 计算当天的训练次数
                const workoutCount = workouts[dateStr] && workouts[dateStr].workouts 
                    ? workouts[dateStr].workouts.length 
                    : 0;
                
                data.push(workoutCount);
            }
            
            // 创建图表
            app.charts.trend = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '训练次数',
                        data: data,
                        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--tw-color-primary') || '#3B82F6',
                        borderRadius: 6,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0,
                                color: document.documentElement.classList.contains('dark') ? '#9CA3AF' : '#6B7280'
                            },
                            grid: {
                                color: document.documentElement.classList.contains('dark') ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: document.documentElement.classList.contains('dark') ? '#9CA3AF' : '#6B7280'
                            },
                            grid: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // 获取第一条训练记录的日期
        function getFirstWorkoutDate() {
            const dates = Object.keys(app.workouts).sort();
            return dates.length > 0 ? new Date(dates[0]) : null;
        }

        // 格式化日期
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 格式化标签
        function formatLabel(date, range) {
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            switch (range) {
                case 'week':
                    return ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
                case 'month':
                    return `${month}/${day}`;
                case 'year':
                case 'all':
                    return `${month}月`;
                default:
                    return `${month}/${day}`;
            }
        }

        // 更新智能建议
        function updateAISuggestions(stats) {
            const suggestionsContainer = document.getElementById('ai-suggestions');
            suggestionsContainer.innerHTML = '';
            
            // 计算训练记录总数
            let totalWorkouts = 0;
            for (const dateStr in app.workouts) {
                if (app.workouts[dateStr].workouts) {
                    totalWorkouts += app.workouts[dateStr].workouts.length;
                }
            }
            
            // 如果没有训练记录，显示欢迎信息
            if (totalWorkouts === 0) {
                suggestionsContainer.innerHTML = `
                    <p class="flex items-start gap-2">
                        <i class="fa fa-info-circle mt-1 text-primary"></i>
                        <span>开始记录你的训练，我们将根据你的数据提供个性化建议！</span>
                    </p>
                `;
                return;
            }
            
            // 使用统一的建议生成函数
            const suggestions = generateSmartSuggestions(stats, totalWorkouts);
            
            // 显示建议
            suggestions.forEach(suggestion => {
                const suggestionElement = document.createElement('p');
                suggestionElement.className = 'flex items-start gap-2';
                suggestionElement.innerHTML = `
                    <i class="fa ${suggestion.icon} mt-1 text-primary"></i>
                    <span>${suggestion.text}</span>
                `;
                suggestionsContainer.appendChild(suggestionElement);
            });
        }

                elements.unitKg.classList.replace('btn-primary', 'btn-outline');
                elements.unitLb.classList.replace('btn-outline', 'btn-primary');
            }
            
            // 更新表单中的单位显示
            const weightInputs = document.querySelectorAll('[data-type="weight"]');
            weightInputs.forEach(input => {
                input.placeholder = `重量 (${unit})`;
            });
            
            // 如果在训练记录页面，重新加载记录
            if (app.currentView === 'workout' && app.selectedDate) {
                loadWorkoutRecords(app.selectedDate);
            }
            
            // 保存设置
            saveData();
        }

        // 切换通知

        // 导出数据
        function exportData() {
            const data = {
                workouts: app.workouts,
                settings: app.settings,
                exportDate: new Date().toISOString()
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `fitness-data-${formatDate(new Date())}.json`;
            link.click();
            
            showToast('数据已导出', 'success');
        }

        // 导入数据
        function importData() {
            const input = document.getElementById('import-input');
            input.click();
        }

        // 处理文件导入
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // 验证数据格式
                    if (!importedData.workouts || typeof importedData.workouts !== 'object') {
                        throw new Error('无效的数据格式');
                    }
                    
                    showConfirmDialog(
                        '导入数据',
                        '导入数据将覆盖当前所有训练记录，确定要继续吗？',
                        () => {
                            // 导入数据
                            if (importedData.workouts) {
                                app.workouts = importedData.workouts;
                            }
                            if (importedData.settings) {
                                app.settings = { ...app.settings, ...importedData.settings };
                            }
                            
                            // 保存数据
                            saveData();
                            
                            // 应用设置
                            applySettings();
                            
                            // 更新视图
                            renderCalendar();
                            
                            if (app.currentView === 'workout') {
                                loadWorkoutRecords(app.selectedDate);
                            } else if (app.currentView === 'stats') {
                                updateStats('week');
                            }
                            
                            showToast('数据导入成功', 'success');
                        }
                    );
                } catch (error) {
                    console.error('导入数据失败:', error);
                    showToast('导入失败：无效的文件格式', 'error');
                }
            };
            
            reader.onerror = function(error) {
                console.error('读取文件失败:', error);
                showToast('读取文件失败', 'error');
            };
            
            reader.readAsText(file);
            
            // 清空文件输入，以便可以重复选择同一个文件
            event.target.value = '';
        }

            } else if (app.currentView === 'stats') {

            }

        // 应用背景图片

                // 更新透明度滑块
                document.getElementById('background-opacity').value = opacity * 100;
                
                // 为了确保文字可读性，调整内容区域的背景透明度
                const mainContent = document.querySelector('main');
                const header = document.querySelector('header');
                const footer = document.querySelector('footer');

                const header = document.querySelector('header');
                const footer = document.querySelector('footer');

        // 显示裁剪模态框
        function showCropModal() {
            console.log('显示裁剪模态框');
            const modal = document.getElementById('crop-modal');
            const image = document.getElementById('crop-image');
            const selection = document.getElementById('crop-selection');
            const opacitySlider = document.getElementById('crop-opacity');
            
            if (!modal || !image || !selection) {
                console.error('裁剪模态框必要元素未找到');
                return;
            }
            
            if (!app.tempBackgroundImage) {
                console.error('临时背景图片数据不存在');
                return;
            }
            
            // 设置图片源（使用临时图片数据）
            image.src = app.tempBackgroundImage;
            
            // 设置透明度滑块初始值
            if (opacitySlider) {
                opacitySlider.value = app.settings.backgroundOpacity * 100;
                console.log('设置透明度滑块初始值:', opacitySlider.value);
            }
            
            // 等待图片加载完成后设置裁剪框
            image.onload = function() {
                console.log('图片加载完成，设置裁剪框');
                const container = image.parentElement;
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;
                
                console.log('容器尺寸:', containerWidth, 'x', containerHeight);
                
                // 计算手机比例裁剪框大小 (9:16)
                const aspectRatio = 9 / 16;
                let selectionWidth, selectionHeight;
                
                if (containerWidth / containerHeight > aspectRatio) {
                    // 容器较宽，以高度为基准
                    selectionHeight = containerHeight * 0.8;
                    selectionWidth = selectionHeight * aspectRatio;
                } else {
                    // 容器较窄，以宽度为基准
                    selectionWidth = containerWidth * 0.8;
                    selectionHeight = selectionWidth / aspectRatio;
                }
                
                console.log('裁剪框尺寸:', selectionWidth, 'x', selectionHeight);
                
                // 设置裁剪框位置和大小
                selection.style.width = selectionWidth + 'px';
                selection.style.height = selectionHeight + 'px';
                selection.style.left = (containerWidth - selectionWidth) / 2 + 'px';
                selection.style.top = (containerHeight - selectionHeight) / 2 + 'px';
                
                // 设置图片样式
                image.style.opacity = app.settings.backgroundOpacity;
                
                // 添加拖拽功能
                let isDragging = false;
                let startX, startY, startLeft, startTop;
                
                selection.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    startLeft = parseInt(selection.style.left);
                    startTop = parseInt(selection.style.top);
                    selection.style.cursor = 'grabbing';
                });
                
                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    
                    const deltaX = e.clientX - startX;
                    const deltaY = e.clientY - startY;
                    
                    let newLeft = startLeft + deltaX;
                    let newTop = startTop + deltaY;
                    
                    // 限制在容器内
                    newLeft = Math.max(0, Math.min(newLeft, containerWidth - selectionWidth));
                    newTop = Math.max(0, Math.min(newTop, containerHeight - selectionHeight));
                    
                    selection.style.left = newLeft + 'px';
                    selection.style.top = newTop + 'px';
                });
                
                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        selection.style.cursor = 'move';
                    }
                });
                
                // 显示模态框
                modal.classList.remove('hidden');
                console.log('裁剪模态框已显示');
            };
            
            image.onerror = function() {
                console.error('图片加载失败');
            };
        }

        // 使裁剪区域可拖拽
        function makeSelectionDraggable(selection, container, image) {
            let isDragging = false;
            let startX, startY, startLeft, startTop;
            
            selection.addEventListener('mousedown', startDrag);
            selection.addEventListener('touchstart', startDrag, { passive: false });
            
            function startDrag(e) {
                e.preventDefault();
                isDragging = true;
                
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                startX = clientX;
                startY = clientY;
                startLeft = parseInt(selection.style.left);
                startTop = parseInt(selection.style.top);
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);
            }
            
            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                
                const clientX = e.clientX || e.touches[0].clientX;
                const clientY = e.clientY || e.touches[0].clientY;
                
                const deltaX = clientX - startX;
                const deltaY = clientY - startY;
                
                let newLeft = startLeft + deltaX;
                let newTop = startTop + deltaY;
                
                // 限制在容器内
                const maxLeft = container.offsetWidth - selection.offsetWidth;
                const maxTop = container.offsetHeight - selection.offsetHeight;
                
                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));
                
                selection.style.left = newLeft + 'px';
                selection.style.top = newTop + 'px';
            }
            
            function stopDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchend', stopDrag);
            }
        }

        // 应用裁剪
        function applyCrop() {
            console.log('开始应用裁剪');
            const image = document.getElementById('crop-image');
            const selection = document.getElementById('crop-selection');
            const opacitySlider = document.getElementById('crop-opacity');
            
            if (!image || !selection) {
                console.error('裁剪必要元素未找到');
                return;
            }
            
            // 获取透明度设置
            const opacity = opacitySlider ? opacitySlider.value / 100 : 0.9;
            console.log('透明度设置:', opacity);
            
            try {
                // 获取裁剪参数
                const container = image.parentElement;
                const containerWidth = container.offsetWidth;
                const containerHeight = container.offsetHeight;
                
                const selectionLeft = parseInt(selection.style.left);
                const selectionTop = parseInt(selection.style.top);
                const selectionWidth = selection.offsetWidth;
                const selectionHeight = selection.offsetHeight;
                
                console.log('裁剪参数:', {
                    containerWidth, containerHeight,
                    selectionLeft, selectionTop,
                    selectionWidth, selectionHeight
                });
                
                // 计算图片在容器中的显示比例
                const imageRatio = image.naturalWidth / image.naturalHeight;
                const containerRatio = containerWidth / containerHeight;
                
                console.log('图片比例:', imageRatio, '容器比例:', containerRatio);
                
                let displayWidth, displayHeight, displayLeft, displayTop;
                
                if (imageRatio > containerRatio) {
                    // 图片较宽，上下留黑边
                    displayWidth = containerWidth;
                    displayHeight = containerWidth / imageRatio;
                    displayLeft = 0;
                    displayTop = (containerHeight - displayHeight) / 2;
                } else {
                    // 图片较高，左右留黑边
                    displayHeight = containerHeight;
                    displayWidth = containerHeight * imageRatio;
                    displayTop = 0;
                    displayLeft = (containerWidth - displayWidth) / 2;
                }
                
                console.log('显示尺寸:', displayWidth, 'x', displayHeight, '位置:', displayLeft, displayTop);
                
                // 计算实际裁剪区域（相对于原始图片）
                const cropLeft = ((selectionLeft - displayLeft) / displayWidth) * image.naturalWidth;
                const cropTop = ((selectionTop - displayTop) / displayHeight) * image.naturalHeight;
                const cropWidth = (selectionWidth / displayWidth) * image.naturalWidth;
                const cropHeight = (selectionHeight / displayHeight) * image.naturalHeight;
                
                console.log('实际裁剪区域:', cropLeft, cropTop, cropWidth, cropHeight);
                
                // 检查裁剪参数是否有效
                if (cropLeft < 0 || cropTop < 0 || cropWidth <= 0 || cropHeight <= 0 || 
                    cropLeft + cropWidth > image.naturalWidth || 
                    cropTop + cropHeight > image.naturalHeight) {
                    console.error('无效的裁剪参数');
                    showToast('裁剪区域无效', 'error');
                    return;
                }
                
                // 创建canvas进行裁剪（使用手机屏幕比例）
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // 设置canvas为手机屏幕比例 (9:16)
                canvas.width = 1080;
                canvas.height = 1920;
                
                console.log('创建canvas:', canvas.width, 'x', canvas.height);
                
                // 加载原始图片
                const originalImg = new Image();
                originalImg.crossOrigin = 'anonymous';
                originalImg.onload = function() {
                    try {
                        console.log('原始图片加载完成，开始绘制');
                        // 绘制裁剪后的图片
                        ctx.drawImage(
                            originalImg,
                            cropLeft, cropTop, cropWidth, cropHeight,
                            0, 0, canvas.width, canvas.height
                        );
                        
                        // 转换为base64并保存
                        const croppedImage = canvas.toDataURL('image/jpeg', 0.8);
                        console.log('裁剪完成，生成base64数据');
                        
                        // 更新设置
                        app.settings.backgroundImage = croppedImage;
                        app.settings.backgroundOpacity = opacity;
                        
                        // 立即应用背景图片
                        const body = document.body;
                        body.style.backgroundImage = `url('${croppedImage}')`;
                        body.style.backgroundSize = 'cover';
                        body.style.backgroundPosition = 'center';
                        body.style.backgroundAttachment = 'fixed';
                        body.style.backgroundOpacity = opacity;
                        
                        // 保存设置
                        saveData();
                        console.log('设置已保存');
                        
                        // 关闭模态框
                        document.getElementById('crop-modal').classList.add('hidden');
                        
                        // 显示成功提示
                        showToast('背景图片已设置', 'success');
                        
                    } catch (error) {
                        console.error('绘制图片时出错:', error);
                        showToast('设置背景图片失败', 'error');
                    }
                };
                
                originalImg.onerror = function() {
                    console.error('加载原始图片失败');
                    showToast('设置背景图片失败', 'error');
                };
                
                originalImg.src = app.tempBackgroundImage;
                
            } catch (error) {
                console.error('裁剪过程中出错:', error);
                showToast('设置背景图片失败', 'error');
            }
        }
